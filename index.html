<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный банк • киберпанк</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background: #0b0c1a;
            color: #e0f2fe;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* анимированная сетка (киберпанк-фон) */
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background-image: 
                linear-gradient(#00f7ff10 1px, transparent 1px),
                linear-gradient(90deg, #ff00d410 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotate(-5deg) scale(1.2);
            top: -20%;
            left: -20%;
            z-index: -2;
            animation: gridShift 20s linear infinite;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 0, 255, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.12) 0%, transparent 50%);
            z-index: -1;
        }

        @keyframes gridShift {
            0% { transform: rotate(-5deg) translateY(0) scale(1.2); }
            100% { transform: rotate(-5deg) translateY(40px) scale(1.2); }
        }

        /* стеклянные карточки */
        .glass-card {
            background: rgba(10, 20, 40, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(255, 0, 255, 0.1);
            padding: 24px;
            transition: all 0.2s;
        }

        .glass-card:hover {
            border-color: #ff00d4;
            box-shadow: 0 0 40px #ff00d480, inset 0 0 20px #00ffff80;
        }

        /* неоновые кнопки */
        .neon-btn {
            background: transparent;
            border: 1px solid #0ff;
            color: #0ff;
            padding: 10px 18px;
            border-radius: 40px;
            font-family: 'Roboto Mono', monospace;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px #0ff;
        }

        .neon-btn:hover {
            background: #0ff;
            color: #0b0c1a;
            box-shadow: 0 0 30px #0ff, 0 0 60px #ff00d4;
            border-color: #ff00d4;
        }

        .neon-btn.danger {
            border-color: #ff00d4;
            color: #ff00d4;
            box-shadow: 0 0 10px #ff00d4;
        }

        .neon-btn.danger:hover {
            background: #ff00d4;
            color: #0b0c1a;
        }

        /* поле ввода */
        .neon-input {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            border-radius: 40px;
            padding: 12px 20px;
            font-family: 'Roboto Mono', monospace;
            color: #fff;
            outline: none;
            width: 100%;
            box-shadow: inset 0 0 10px #0ff40, 0 0 5px #0ff;
        }

        .neon-input:focus {
            border-color: #ff00d4;
            box-shadow: 0 0 20px #ff00d4, inset 0 0 10px #ff00d4;
        }

        /* контейнеры */
        #auth-screen, #app-screen {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* шапка профиля */
        .profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .balance-badge {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #0ff;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 1.8rem;
            font-weight: 600;
            box-shadow: 0 0 30px cyan;
            backdrop-filter: blur(6px);
        }

        .balance-badge i {
            color: #ff0;
            margin-right: 12px;
        }

        /* сетка интерфейса */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .game-card {
            background: rgba(16, 20, 40, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid magenta;
            border-radius: 20px;
            padding: 20px 12px;
            text-align: center;
            box-shadow: 0 0 20px #ff00d4;
        }

        .history-list, .chat-messages {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 6px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-messages {
            max-height: 150px;
        }

        .message-item, .transaction-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid cyan;
            padding: 8px 12px;
            border-radius: 12px;
        }

        .timestamp {
            color: #ff80d4;
            font-size: 0.7rem;
            margin-right: 8px;
        }

        /* форма входа */
        .auth-box {
            max-width: 460px;
            margin: 40px auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: 1px solid cyan;
            color: cyan;
            padding: 12px;
            border-radius: 60px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: cyan;
            color: black;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        hr {
            border: 0.5px solid #0ff40;
            margin: 20px 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #001020;
        }

        ::-webkit-scrollbar-thumb {
            background: #0ff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="glass-card auth-box">
        <h1 style="text-align:center; margin-bottom:24px; text-shadow:0 0 15px cyan;">‹ ВИРТУАЛЬНЫЙ БАНК ›</h1>
        <div class="tabs">
            <button id="login-tab-btn" class="tab-btn active">вход</button>
            <button id="register-tab-btn" class="tab-btn">регистрация</button>
        </div>

        <!-- Форма входа -->
        <div id="login-form">
            <div class="neon-input" style="margin-bottom:16px;">
                <i class="fas fa-user"></i>
                <input type="text" id="login-username" placeholder="логин" style="background:none; border:none; color:white; width:90%; outline:none;">
            </div>
            <div class="neon-input" style="margin-bottom:24px;">
                <i class="fas fa-lock"></i>
                <input type="password" id="login-password" placeholder="пароль" style="background:none; border:none; color:white; width:90%; outline:none;">
            </div>
            <button id="login-btn" class="neon-btn" style="width:100%;">войти в систему</button>
            <p id="login-error" style="color:#ff80d4; margin-top:16px;"></p>
        </div>

        <!-- Форма регистрации (скрыта) -->
        <div id="register-form" class="hidden">
            <div class="neon-input" style="margin-bottom:16px;">
                <i class="fas fa-user"></i>
                <input type="text" id="reg-username" placeholder="новый логин" style="background:none; border:none; color:white; width:90%; outline:none;">
            </div>
            <div class="neon-input" style="margin-bottom:24px;">
                <i class="fas fa-lock"></i>
                <input type="password" id="reg-password" placeholder="пароль" style="background:none; border:none; color:white; width:90%; outline:none;">
            </div>
            <button id="register-btn" class="neon-btn danger" style="width:100%;">создать аккаунт</button>
            <p id="register-error" style="color:#ff80d4; margin-top:16px;"></p>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <!-- шапка -->
        <div class="profile-bar">
            <div class="balance-badge glass-card" style="padding:12px 32px;">
                <i class="fas fa-coins"></i> <span id="balance-display">0</span> CR
            </div>
            <button id="logout-btn" class="neon-btn danger"><i class="fas fa-sign-out-alt"></i> exit</button>
        </div>

        <!-- основная сетка -->
        <div class="dashboard">
            <!-- левая панель: игры -->
            <div class="left-panel">
                <div class="glass-card">
                    <h2 style="margin-bottom:16px;"><i class="fas fa-gamepad" style="color:#0ff;"></i> игровые режимы</h2>
                    <div class="games-grid">
                        <!-- кликер-майнер -->
                        <div class="game-card">
                            <i class="fas fa-hand-fist" style="font-size:2rem; color:#ff0;"></i>
                            <h3>Кликер-майнер</h3>
                            <p style="font-size:0.8rem; margin:8px 0;">кликай — добывай (1–20)</p>
                            <button id="game-mine" class="neon-btn" style="padding:6px 16px;">МАЙНИТЬ</button>
                        </div>
                        <!-- инвестиционный хаос -->
                        <div class="game-card">
                            <i class="fas fa-chart-line" style="font-size:2rem; color:#ff00d4;"></i>
                            <h3>Инвест-хаос</h3>
                            <p style="font-size:0.8rem; margin:8px 0;">рискни: -30 до +80</p>
                            <button id="game-invest" class="neon-btn" style="padding:6px 16px;">РИСКНУТЬ</button>
                        </div>
                        <!-- банковский квест -->
                        <div class="game-card">
                            <i class="fas fa-shield" style="font-size:2rem; color:#0ff;"></i>
                            <h3>Квест</h3>
                            <p style="font-size:0.8rem; margin:8px 0;">+50 (кулдаун 10с)</p>
                            <button id="game-quest" class="neon-btn" style="padding:6px 16px;">ВЫПОЛНИТЬ</button>
                            <span id="quest-cooldown" style="display:block; font-size:0.7rem; margin-top:6px;"></span>
                        </div>
                    </div>
                </div>

                <!-- Чат -->
                <div class="glass-card">
                    <h2 style="margin-bottom:16px;"><i class="fas fa-comments" style="color:#ff80d4;"></i> общий чат</h2>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div style="display:flex; gap:10px; margin-top:16px;">
                        <input type="text" id="chat-input" class="neon-input" placeholder="сообщение..." style="flex:1;">
                        <button id="chat-send" class="neon-btn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- правая панель: переводы и история -->
            <div class="right-panel">
                <!-- переводы -->
                <div class="glass-card">
                    <h2 style="margin-bottom:16px;"><i class="fas fa-exchange-alt" style="color:#0ff;"></i> перевод</h2>
                    <div style="display:flex; gap:12px; flex-wrap:wrap;">
                        <input type="text" id="transfer-to" class="neon-input" placeholder="кому (логин)" style="flex:2;">
                        <input type="number" id="transfer-amount" class="neon-input" placeholder="сумма" min="1" style="flex:1;">
                    </div>
                    <button id="transfer-btn" class="neon-btn" style="width:100%; margin-top:16px;">перевести</button>
                    <p id="transfer-status" style="margin-top:12px; color: #ff80d4;"></p>
                </div>

                <!-- история транзакций -->
                <div class="glass-card">
                    <h2 style="margin-bottom:16px;"><i class="fas fa-history" style="color:#ff00d4;"></i> история движений</h2>
                    <div id="transaction-history" class="history-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== ИНИЦИАЛИЗАЦИЯ STORAGE ====================
            function initStorage() {
                if (!localStorage.getItem('users')) {
                    localStorage.setItem('users', JSON.stringify({})); // { "login": { password, balance } }
                }
                if (!localStorage.getItem('transactions')) {
                    localStorage.setItem('transactions', JSON.stringify([])); // [{ from, to, amount, timestamp }]
                }
                if (!localStorage.getItem('messages')) {
                    localStorage.setItem('messages', JSON.stringify([])); // [{ from, text, timestamp }]
                }
            }
            initStorage();

            // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
            let currentUser = null; // логин активного пользователя
            let questCooldown = false; // для квеста

            // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
            function getUsers() {
                return JSON.parse(localStorage.getItem('users'));
            }

            function saveUsers(users) {
                localStorage.setItem('users', JSON.stringify(users));
            }

            function getTransactions() {
                return JSON.parse(localStorage.getItem('transactions'));
            }

            function saveTransactions(txs) {
                localStorage.setItem('transactions', JSON.stringify(txs));
            }

            function getMessages() {
                return JSON.parse(localStorage.getItem('messages'));
            }

            function saveMessages(msgs) {
                localStorage.setItem('messages', JSON.stringify(msgs));
            }

            function escapeHTML(str) {
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // обновление UI после любого действия
            function refreshUI() {
                if (!currentUser) return;

                const users = getUsers();
                const userData = users[currentUser];
                if (!userData) return;
                document.getElementById('balance-display').innerText = userData.balance;

                // история транзакций
                const txs = getTransactions();
                const historyDiv = document.getElementById('transaction-history');
                historyDiv.innerHTML = '';
                const relevant = txs.filter(tx => tx.from === currentUser || tx.to === currentUser).reverse().slice(0, 15);
                if (relevant.length === 0) {
                    historyDiv.innerHTML = '<p class="message-item">пока нет операций</p>';
                } else {
                    relevant.forEach(tx => {
                        const date = new Date(tx.timestamp).toLocaleTimeString('ru-RU');
                        const direction = (tx.from === currentUser) ? `→ ${tx.to}` : `← ${tx.from}`;
                        const sign = (tx.from === currentUser) ? '- ' : '+ ';
                        const item = document.createElement('div');
                        item.className = 'transaction-item';
                        item.innerHTML = `<span class="timestamp">${date}</span> ${direction}  <strong style="color:${tx.from===currentUser?'#ff80d4':'#0ff'}">${sign}${tx.amount} CR</strong>`;
                        historyDiv.appendChild(item);
                    });
                }

                // чат
                const msgs = getMessages();
                const chatDiv = document.getElementById('chat-messages');
                chatDiv.innerHTML = '';
                msgs.slice(-20).forEach(m => {
                    const date = new Date(m.timestamp).toLocaleTimeString('ru-RU');
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message-item';
                    msgDiv.innerHTML = `<span class="timestamp">${date}</span> <strong style="color:#ff0;">${escapeHTML(m.from)}</strong>: ${escapeHTML(m.text)}`;
                    chatDiv.appendChild(msgDiv);
                });
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }

            // ==================== АВТОРИЗАЦИЯ ====================
            const authScreen = document.getElementById('auth-screen');
            const appScreen = document.getElementById('app-screen');

            function showApp() {
                authScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                refreshUI();
            }

            function showAuth() {
                authScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
                currentUser = null;
            }

            // переключение табов входа/регистрации
            document.getElementById('login-tab-btn').addEventListener('click', () => {
                document.getElementById('login-tab-btn').classList.add('active');
                document.getElementById('register-tab-btn').classList.remove('active');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-error').innerText = '';
                document.getElementById('register-error').innerText = '';
            });

            document.getElementById('register-tab-btn').addEventListener('click', () => {
                document.getElementById('register-tab-btn').classList.add('active');
                document.getElementById('login-tab-btn').classList.remove('active');
                document.getElementById('register-form').classList.remove('hidden');
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('login-error').innerTex
